# PropelAI Realty OS — Cloudflare Pages via @opennextjs/cloudflare
#
# Cloudflare Pages Dashboard settings:
#   Build command:        npx @opennextjs/cloudflare build
#   Build output dir:     .open-next/assets
#   Root directory:       /  (leave blank)
#   Node.js version:      22

name = "propelai-realty-crm"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = ".open-next/assets"

# Environment variables are set in the Cloudflare Pages dashboard
# under Settings → Environment Variables — do NOT put secrets here.
